.tab{font-size:13px;font-weight:500;padding:9px 16px;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}

.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

function parse(raw){
  const lines=raw.trim().split('\n');
  const hdr=lines[0].split(';').map(h=>h.replace(/"/g,'').trim());
  return lines.slice(1).map(l=>{
    const v=l.split(';').map(x=>x.replace(/^"|"$/g,'').trim());
    const o={};hdr.forEach((h,i)=>o[h]=v[i]||'');return o;
  }).filter(r=>r.participant_id);
}
function normScore(s,premier,pair){
  const v=parseFloat(s);if(isNaN(v)||v<1||v>8)return null;
  return premier===pair[0]?v-4.5:4.5-v;
}

function lgamma(x){
  const C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
    771.32342877765313,-176.61502916214059,12.507343278686905,
    -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];

  for(let i=1;i<9;i++)a+=C[i]/(z+i);
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(a);
}

    c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<EPS)break;
  }
  return h;
}
function betaInc(x,a,b){
  if(x<=0)return 0;if(x>=1)return 1;
  if(x>(a+1)/(a+b+2))return 1-betaInc(1-x,b,a);
  const lbet=lgamma(a)+lgamma(b)-lgamma(a+b);
  return Math.exp(Math.log(x)*a+Math.log(1-x)*b-lbet)/a*betaCF(x,a,b);
}
function tPValue(t,df){
  // Two-tailed p-value: P(|T_df| > t) = I_x(df/2, 1/2) with x = df/(df+t²)
  return betaInc(df/(df+t*t),df/2,0.5);
}

// One-sample t-test (H0: mean=0)
function tTest1(vals){
  const n=vals.length;if(n<2)return null;
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const v=vals.reduce((s,x)=>s+(x-mean)**2,0)/(n-1);
  const se=Math.sqrt(v/n);if(se<1e-10)return{t:Infinity,p:mean?0:1,n,mean,se,df:n-1};
  const t=mean/se,df=n-1;
  return{t,p:tPValue(Math.abs(t),df),n,mean,se,df};
}
// Welch two-sample t-test (H0: means equal)
function welch(a,b){
  const na=a.length,nb=b.length;if(na<2||nb<2)return null;
  const ma=a.reduce((s,v)=>s+v,0)/na,mb=b.reduce((s,v)=>s+v,0)/nb;
  const va=a.reduce((s,v)=>s+(v-ma)**2,0)/(na-1);
  const vb=b.reduce((s,v)=>s+(v-mb)**2,0)/(nb-1);
  const se=Math.sqrt(va/na+vb/nb);if(se<1e-10)return null;
  const t=(ma-mb)/se;
  const df=(va/na+vb/nb)**2/((va/na)**2/(na-1)+(vb/nb)**2/(nb-1));
  return{t,p:tPValue(Math.abs(t),df),df,ma,mb,na,nb};
}
function pvBadge(p){
  if(p===null||p===undefined)return '';
  if(p<0.001)return`<span class="pv pv-s3">p&lt;.001 ***</span>`;
  if(p<0.01) return`<span class="pv pv-s2">p=${p.toFixed(3)} **</span>`;
  if(p<0.05) return`<span class="pv pv-s1">p=${p.toFixed(3)} *</span>`;
  if(p<0.1)  return`<span class="pv pv-ns">p=${p.toFixed(3)} †</span>`;
  return`<span class="pv pv-ns">p=${p.toFixed(2)} ns</span>`;
}
function pvSymbol(p){
  if(p===null)return'';
  if(p<0.001)return'***';if(p<0.01)return'**';if(p<0.05)return'*';if(p<0.1)return'†';return'ns';
}

function getNormVals(crit,rows){
  const acc={A:[],B:[],C:[],D:[]};
  rows.forEach(row=>{
    PAIRS.forEach(pair=>{
      if(!validPair(row,pair))return;
      const [x,y]=pair.split('');
      const n=normScore(row[`${pair}_${crit}`],row[`${pair}_premier`],pair);
      if(n===null)return;
      acc[y].push(n);acc[x].push(-n);
    });
  });
  return acc;
}
function techScores(crit,rows){
  const acc=getNormVals(crit,rows);
  const r={};TECHS.forEach(t=>{const v=acc[t];r[t]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;});
  return r;
}
function techTests(crit,rows){
  const acc=getNormVals(crit,rows);
  const r={};TECHS.forEach(t=>{r[t]=tTest1(acc[t]);});
  return r;
}
function pairVals(pair,crit,rows){
  return rows.filter(r=>validPair(r,pair))
    .map(r=>normScore(r[`${pair}_${crit}`],r[`${pair}_premier`],pair))
    .filter(v=>v!==null);
}
function rank(sc){return TECHS.filter(t=>sc[t]!==null).sort((a,b)=>sc[b]-sc[a]);}

// Score agrégé par participant pour une technique et un critère
// (moyenne sur toutes les paires où la technique apparaît)
function perParticipantScore(row,crit,tech){
  const vals=[];
  PAIRS.forEach(pair=>{
    if(!validPair(row,pair))return;
    const[x,y]=pair.split('');
    if(x!==tech&&y!==tech)return;
    const n=normScore(row[`${pair}_${crit}`],row[`${pair}_premier`],pair);
    if(n===null)return;
    vals.push(tech===y?n:-n); // positif = préfère tech
  });
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}

// Test t apparié : score_techA vs score_techB sur tous les participants
function pairedTest(critere,techA,techB){
  const diffs=DATA.map(row=>{
    const sA=perParticipantScore(row,critere,techA);
    const sB=perParticipantScore(row,critere,techB);
    return(sA!==null&&sB!==null)?sA-sB:null;
  }).filter(v=>v!==null);
  const t=tTest1(diffs);
  const d=cohenD(diffs);
  if(!t)return null;
  return{...t,d,diffs,dir:t.mean>0?techA:t.mean<0?techB:'='};
}

function tPairwise(){
  // All 6 pairs of techniques
  const techPairs=[['A','B'],['A','C'],['A','D'],['B','C'],['B','D'],['C','D']];

  // Precompute all tests for current criterion
  const tests=techPairs.map(([a,b])=>{
    const t=pairedTest(pwCrit,a,b);
    return{a,b,test:t};
  });

  // Precompute all tests for all criteria (for the full table)
  const allTests=[];
  CRIT.forEach(c=>{
    techPairs.forEach(([a,b])=>{
      const t=pairedTest(c,a,b);
      allTests.push({crit:c,a,b,test:t});

  // Matrix for selected criterion

    const found=tests.find(t=>(t.a===a&&t.b===b)||(t.a===b&&t.b===a));
    if(!found||!found.test)return`<td style="background:var(--bg)"></td>`;
    const t=found.test;

    const mean=isSwapped?-t.mean:t.mean;
    const dir=mean>0?a:mean<0?b:'=';
    const col=dir==='='?'#9ca3af':T_COL[dir];
    const op=Math.max(0.1,Math.min(0.85,Math.abs(t.d||0)/1.2));

      <p style="font-size:11px;color:var(--text3);margin-bottom:1rem">Intensité = Cohen's d · Bordure = significativité · Lecture : ligne supérieure à colonne</p>
      <table style="width:100%;border-collapse:separate;border-spacing:4px">
        <thead><tr>
          <th></th>
          ${TECHS.map(t=>`<th style="text-align:center"><span style="color:${T_COL[t]};font-weight:700">${t}</span><div style="font-size:9px;color:var(--text3);font-weight:400">${T_LABEL[t].split(' ')[0]}</div></th>`).join('')}
        </tr></thead>
        <tbody>${TECHS.map((rowT,ri)=>`<tr>

          ${TECHS.map((colT,ci)=>{

            if(ci<ri)return`<td style="background:var(--bg)"></td>`; // lower triangle empty

function cohenD(vals){
  if(vals.length<2)return null;
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1));
  return sd>0?mean/sd:0;
}
function effectLabel(d){
  const a=Math.abs(d);
  if(a>=0.8)return{txt:'Fort',col:'#059669'};
  if(a>=0.5)return{txt:'Modéré',col:'#d97706'};
  if(a>=0.2)return{txt:'Faible',col:'#6b7280'};
  return{txt:'Négligeable',col:'#b0a99e'};
}

// ── TENDANCES VS ALÉATOIRE ───────────────────────────────────────────────────

// Test binomial exact bilatéral (H₀ : p = 0.5)
// P(X >= k | n, 0.5) = betaInc(0.5, k, n-k+1)
function binomialCDF(k, n, p=0.5){
  // P(X <= k) = I_{1-p}(n-k, k+1)
  if(k<0) return 0; if(k>=n) return 1;
  return betaInc(1-p, n-k, k+1);
}
function binomialTest(kPos, n){
  // kPos = nb de participants préférant le second extrait (score normalisé > 0)
  // Two-tailed: p = 2 * min(P(X<=kPos), P(X>=kPos))
  if(n<1) return null;
  const pLeft  = binomialCDF(kPos, n);         // P(X <= kPos)
  const pRight = 1 - binomialCDF(kPos-1, n);   // P(X >= kPos)
  const p = Math.min(1, 2 * Math.min(pLeft, pRight));
  return { kPos, kNeg: n-kPos, n, propPos: kPos/n, p };
}

// Entropie de Shannon normalisée sur les scores NORMALISÉS [-3.5, +3.5]
// binnés en 8 intervalles équidistants
// 0 = tout le monde au même endroit · 1 = distribution parfaitement uniforme
function entropy(normVals){
  if(!normVals||normVals.length===0) return 0;
  // 8 bins de -3.75 à +3.75 (intervalles de 0.875, centrés sur -3.5…+3.5)
  const edges=[-3.75,-2.875,-2.0,-1.125,-0.25,0.625,1.5,2.375,3.75];
  const freq=Array(8).fill(0);
  normVals.forEach(v=>{
    for(let i=0;i<8;i++){
      if(v>=edges[i]&&v<edges[i+1]){freq[i]++;break;}
    }
    // bord supérieur
    if(v>=3.75) freq[7]++;
  });
  const n=normVals.length;
  const H=freq.reduce((h,f)=>{if(f===0)return h;const p=f/n;return h-p*Math.log2(p);},0);
  return H/Math.log2(8);
}

// Consistance intra-participant pour une paire : écart-type des 5 réponses normalisées
// Faible écart-type = participant cohérent sur les 5 critères
function intraConsistency(row, pair){
  if(!validPair(row,pair)) return null;
  const scores = CRIT.map(c=>normScore(row[`${pair}_${c}`], row[`${pair}_premier`], pair))
                      .filter(v=>v!==null);
  if(scores.length<2) return null;
  const m = scores.reduce((a,b)=>a+b,0)/scores.length;
  return Math.sqrt(scores.reduce((s,v)=>s+(v-m)**2,0)/(scores.length-1));
}

function tTendance(){
  // Build test matrix: 6 pairs × 5 criteria
  const tests = [];
  PAIRS.forEach(pair=>{

    CRIT.forEach(crit=>{
      const rows = DATA.filter(r=>validPair(r,pair));
      const normVals = rows.map(r=>normScore(r[`${pair}_${crit}`],r[`${pair}_premier`],pair)).filter(v=>v!==null);
      const rawScores = rows.map(r=>parseFloat(r[`${pair}_${crit}`])).filter(v=>!isNaN(v));
      const kPos = normVals.filter(v=>v>0).length;  // prefer y
      const kNeg = normVals.filter(v=>v<0).length;  // prefer x
      const kNeu = normVals.filter(v=>v===0).length;
      const bt = binomialTest(kPos, normVals.length);
      const ent = entropy(normVals);
      tests.push({pair,x,y,crit,n:normVals.length,kPos,kNeg,kNeu,bt,ent,normVals,rawScores});
    });
  });

  // Per-participant consistency

    const sds = PAIRS.map(pair=>intraConsistency(row,pair)).filter(v=>v!==null);

// ── ALPHA DE CRONBACH ────────────────────────────────────────────────────────
// Calcul sur les scores normalisés par paire et par critère.
// Pour chaque participant, chaque paire donne un vecteur de 5 scores (un par critère).
// L'alpha teste si les 5 critères sont cohérents au sein de chaque paire.

function variance(arr){
  if(arr.length<2)return 0;
  const m=arr.reduce((a,b)=>a+b,0)/arr.length;
  return arr.reduce((s,v)=>s+(v-m)**2,0)/(arr.length-1);
}
function covariance(a,b){
  if(a.length!==b.length||a.length<2)return 0;
  const ma=a.reduce((s,v)=>s+v,0)/a.length;
  const mb=b.reduce((s,v)=>s+v,0)/b.length;
  return a.reduce((s,v,i)=>s+(v-ma)*(b[i]-mb),0)/(a.length-1);
}
function pearsonR(a,b){
  const cov=covariance(a,b);
  const sd=Math.sqrt(variance(a)*variance(b));
  return sd>0?cov/sd:0;
}

// Cronbach alpha sur une matrice items×observations (array of arrays)
function cronbachAlpha(itemArrays){
  const k=itemArrays.length;
  if(k<2)return null;
  const n=itemArrays[0].length;
  if(n<3)return null;
  const sumVarItems=itemArrays.reduce((s,col)=>s+variance(col),0);
  // Variance de la somme
  const totals=Array.from({length:n},(_,i)=>itemArrays.reduce((s,col)=>s+col[i],0));
  const varTot=variance(totals);
  if(varTot===0)return null;
  const alpha=(k/(k-1))*(1-sumVarItems/varTot);
  return alpha;
}

// Pour chaque paire et chaque technique de comparaison,
// récupère la matrice 5 critères × N participants des scores normalisés
function getItemMatrix(pair){
  const rows=DATA.filter(r=>validPair(r,pair));
  return CRIT.map(c=>rows.map(r=>normScore(r[`${pair}_${c}`],r[`${pair}_premier`],pair)).filter(v=>v!==null));
}

// Aussi : alpha sur les 5 critères pour chaque technique (scores agrégés par participant)
function getTechItemMatrix(tech){
  return CRIT.map(c=>DATA.map(r=>perParticipantScore(r,c,tech)).filter(v=>v!==null));
}

function alphaLabel(a){
  if(a===null)return{txt:'N/A',col:'var(--text3)',desc:'Données insuffisantes'};
  if(a>0.9) return{txt:'Excellente',col:'#059669',desc:'Cohérence très forte — items potentiellement redondants'};
  if(a>0.8) return{txt:'Bonne',col:'#2563eb',desc:'Bonne cohérence interne'};
  if(a>0.7) return{txt:'Acceptable',col:'#7c3aed',desc:'Cohérence satisfaisante'};
  if(a>0.6) return{txt:'Questionnable',col:'#d97706',desc:'Cohérence faible à modérée'};
  return{txt:'Faible',col:'#dc2626',desc:'Les critères mesurent des dimensions distinctes'};
}

function alphaBar(a){
  if(a===null)return'';
  const pct=Math.max(0,Math.min(100,a*100));
  const lbl=alphaLabel(a);
  return`<div style="margin-top:6px">
    <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${lbl.col};border-radius:4px"></div>
    </div>
  </div>`;
}

function tCronbach(){
  // 1. Alpha par paire (5 critères = items, N participants = observations)
  const pairAlphas=PAIRS.map(pair=>{
    const mat=getItemMatrix(pair);
    const ns=mat.map(col=>col.length);
    const minN=Math.min(...ns);
    // Align to same participants
    const rows=DATA.filter(r=>validPair(r,pair));
    const aligned=CRIT.map(c=>
      rows.map(r=>normScore(r[`${pair}_${c}`],r[`${pair}_premier`],pair)).filter(v=>v!==null)
    );
    // Only keep participants with all 5 criteria valid
    const full=rows.map((_,i)=>CRIT.map(c=>{
      const v=normScore(rows[i][`${pair}_${c}`],rows[i][`${pair}_premier`],pair);
      return v;
    })).filter(row=>row.every(v=>v!==null));
    const transposed=CRIT.map((_,ci)=>full.map(row=>row[ci]));
    const alpha=transposed[0].length>=3?cronbachAlpha(transposed):null;
    // Item-total correlations
    const itc=CRIT.map((_,ci)=>{
      const item=transposed[ci];
      const rest=CRIT.map((_,cj)=>transposed[cj]).filter((_,cj)=>cj!==ci);
      const restSum=item.map((_,i)=>rest.reduce((s,col)=>s+col[i],0));
      return pearsonR(item,restSum);
    });
    return{pair,alpha,n:full.length,itc};
  });

  // 2. Alpha global sur toutes les paires combinées (5 critères × tous scores)
  const allRows=[];
  DATA.forEach(row=>{
    PAIRS.forEach(pair=>{
      if(!validPair(row,pair))return;
      const scores=CRIT.map(c=>normScore(row[`${pair}_${c}`],row[`${pair}_premier`],pair));
      if(scores.every(v=>v!==null))allRows.push(scores);
    });
  });
  const globalMat=CRIT.map((_,ci)=>allRows.map(row=>row[ci]));
  const alphaGlobal=cronbachAlpha(globalMat);
  const lbGlobal=alphaLabel(alphaGlobal);

  // 3. Alpha par technique (5 critères sur scores agrégés par participant)
  const techAlphas=TECHS.map(tech=>{
    const full=DATA.map(row=>{
      const scores=CRIT.map(c=>perParticipantScore(row,c,tech));
      return scores.every(v=>v!==null)?scores:null;
    }).filter(v=>v!==null);
    const mat=CRIT.map((_,ci)=>full.map(row=>row[ci]));
    const alpha=full.length>=3?cronbachAlpha(mat):null;
    const itc=CRIT.map((_,ci)=>{
      const item=mat[ci];
      const rest=mat.filter((_,cj)=>cj!==ci);
      const restSum=item.map((_,i)=>rest.reduce((s,col)=>s+col[i],0));
      return pearsonR(item,restSum);
    });
    return{tech,alpha,n:full.length,itc};
  });

  // 4. Inter-item correlations (global)
  const interR=CRIT.map((_,ci)=>CRIT.map((_,cj)=>{
    if(ci===cj)return 1;
    return pearsonR(globalMat[ci],globalMat[cj]);
  }));

  return`
  <div class="note">
    L'alpha de Cronbach mesure la <strong>cohérence interne</strong> des 5 critères.
    Un alpha élevé (> 0.7) indique qu'ils mesurent un même construit latent et peuvent être agrégés en score global.
    Un alpha faible indique des dimensions perceptives indépendantes.
    <br><br>
    <strong>Trois niveaux de calcul ici :</strong><br>
    • <strong>Alpha global</strong> — 30 participants × 6 paires = 180 observations. Signification : quand un participant préfère un extrait sur un critère, le préfère-t-il aussi sur les autres ?
    ⚠️ Les 6 paires d'un même participant ne sont pas indépendantes — alpha par paire plus rigoureux.<br>
    • <strong>Alpha par paire</strong> — 30 observations indépendantes par paire. Le plus pertinent : "les 5 critères convergent-ils vers le même jugement lors de la comparaison XY ?"<br>
    • <strong>Alpha par technique</strong> — scores agrégés par participant. "Les 5 critères sont-ils cohérents pour évaluer cette technique ?"
  </div>

  <div class="row-4" style="margin-bottom:16px">
    <div class="card" style="grid-column:span 2">
      <div class="card-title">Alpha global — tous scores · tous participants</div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:.5rem">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:500;color:${lbGlobal.col}">${alphaGlobal!==null?alphaGlobal.toFixed(3):'N/A'}</span>
        <div>
          <div style="font-size:14px;font-weight:600;color:${lbGlobal.col}">${lbGlobal.txt}</div>
          <div style="font-size:11px;color:var(--text3)">${lbGlobal.desc}</div>
        </div>
      </div>
      ${alphaBar(alphaGlobal)}
      <div style="font-size:11px;color:var(--text3);margin-top:.5rem">${allRows.length} observations · k=5 items</div>
    </div>
    <div class="card" style="grid-column:span 2">
      <div class="card-title">Matrice de corrélations inter-items</div>
      <table style="font-size:11px">
        <thead><tr><th></th>${CRIT.map(c=>`<th style="text-align:center">${CRIT_L[c].slice(0,5)}.</th>`).join('')}</tr></thead>
        <tbody>${CRIT.map((c,ci)=>`<tr>
          <th style="text-align:right;padding-right:6px;white-space:nowrap">${CRIT_L[c]}</th>
          ${interR[ci].map((r,cj)=>{
            if(ci===cj)return`<td style="text-align:center;background:var(--border);border-radius:3px" class="mono">—</td>`;
            const col=r>0.5?'#059669':r>0.3?'#2563eb':r>0.1?'#d97706':'#9ca3af';
            return`<td style="text-align:center" class="mono" style="color:${col}">${r.toFixed(2)}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="card-title">Alpha de Cronbach par technique (scores agrégés par participant)</div>
    <p style="font-size:11px;color:var(--text3);margin-bottom:1rem">Pour chaque technique, les 5 critères sont-ils cohérents entre eux quand on regarde les scores de cette technique ?</p>
    <div class="row-4">
      ${techAlphas.map(({tech,alpha,n,itc})=>{
        const lb=alphaLabel(alpha);
        return`<div class="tc" style="border-color:${alpha>0.7?T_COL[tech]:'var(--border)'}">
          <div class="tc-head"><span class="tc-dot" style="background:${T_COL[tech]}"></span><span class="tc-label">Extrait ${tech}</span></div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;color:${lb.col}">${alpha!==null?alpha.toFixed(3):'N/A'}</div>
          <div style="font-size:11px;font-weight:600;color:${lb.col};margin-top:3px">${lb.txt}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">${T_LABEL[tech]}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:4px">n=${n}</div>
          ${alphaBar(alpha)}
          <div style="margin-top:.75rem;font-size:10px;color:var(--text3)">Corr. item-total :</div>
          ${CRIT.map((c,ci)=>`<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px">
            <span style="color:var(--text3)">${CRIT_L[c].slice(0,8)}.</span>
            <span class="mono" style="color:${Math.abs(itc[ci])>0.4?T_COL[tech]:'var(--text2)'}">${itc[ci].toFixed(2)}</span>
          </div>`).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <div class="card-title">Alpha de Cronbach par paire de comparaison</div>
    <p style="font-size:11px;color:var(--text3);margin-bottom:1rem">Pour chaque paire, les 5 critères convergent-ils vers un même jugement ?</p>
    <table>
      <thead><tr>
        <th>Paire</th><th>Comparaison</th><th>n</th><th>Alpha (α)</th><th>Interprétation</th>
        ${CRIT.map(c=>`<th style="text-align:center">r item-total<br>${CRIT_L[c].slice(0,5)}.</th>`).join('')}
      </tr></thead>
      <tbody>${pairAlphas.map(({pair,alpha,n,itc})=>{
        const[x,y]=pair.split('');
        const lb=alphaLabel(alpha);
        return`<tr>
          <td style="font-weight:700;font-family:'Instrument Serif',serif">${pair}</td>
          <td style="font-size:11px"><span style="color:${T_COL[x]}">${T_LABEL[x].split(' ')[0]} ${x}</span> <span style="color:var(--text3)">vs</span> <span style="color:${T_COL[y]}">${T_LABEL[y].split(' ')[0]} ${y}</span></td>
          <td class="mono">${n}</td>
          <td class="mono" style="font-size:16px;font-weight:500;color:${lb.col}">${alpha!==null?alpha.toFixed(3):'N/A'}</td>
          <td style="color:${lb.col};font-weight:600;font-size:12px">${lb.txt}<div style="font-size:10px;font-weight:400;color:var(--text3)">${lb.desc}</div></td>
          ${itc.map(r=>`<td class="mono" style="text-align:center;color:${Math.abs(r)>0.4?'#059669':'var(--text2)'}">${r.toFixed(2)}</td>`).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="margin-top:1rem;font-size:11px;color:var(--text3);border-top:1px solid var(--border);padding-top:.75rem">
      <strong>r item-total :</strong> corrélation entre un critère et la somme des 4 autres. Une valeur > 0.4 indique que le critère contribue bien à la cohérence de l'ensemble.
    </div>
  </div>`;
}

// ── ANALYSE CROISÉE ───────────────────────────────────────────────────────────
function tCross(){
  const GROUPS=[
    {id:'pro',label:'Profil professionnel',split:r=>r.pro==='Oui'?'Professionnel':'Non-professionnel'},
    {id:'aud',label:'Profil audiophile',split:r=>({Oui:'Audiophile','Un peu':'Intermédiaire',Non:'Non-audiophile'}[r.audiophile]||r.audiophile),mainPair:['Audiophile','Non-audiophile']},
    {id:'dev',label:"Système d'écoute",split:r=>r.device.includes('Casque')?'Casque / écouteurs':'Enceintes'},
    {id:'freq',label:"Fréquence d'écoute",split:r=>r.freq.includes('heures')?'Intensif (plusieurs h/j)':'Occasionnel'},
    {id:'pop',label:'Affinité pop/rap',split:r=>r.pop==='Oui'?'Fan de pop/rap':'Autre',mainPair:['Fan de pop/rap','Autre']},
    {id:'age',label:"Tranche d'âge",split:r=>{const a=parseInt(r.age);return a<25?'18–24 ans':a<29?'25–28 ans':'29+ ans';},mainPair:['18–24 ans','29+ ans']},
  ];

  const cLabel=CRIT_L[crossCrit];

  let html=`
  <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
    <span class="section-title" style="margin-bottom:0">Critère analysé :</span>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${CRIT.map(c=>`<button class="crit-btn ${crossCrit===c?'on':''}" onclick="setCrossCrit('${c}')">${CRIT_L[c]}</button>`).join('')}</div>
  </div>
  <div class="note">Pour chaque variable, comparaison des scores de technique <strong>${cLabel}</strong> entre sous-groupes. Test t de Welch H₀ : les deux groupes perçoivent la technique de façon identique.</div>
  ${sigLegend()}`;

  GROUPS.forEach(g=>{
    const groups={};
    DATA.forEach(r=>{const k=g.split(r);if(!groups[k])groups[k]=[];groups[k].push(r);});
    const gkeys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
    if(gkeys.length<2)return;

    // Main pair for Welch test
    const [kA,kB]=g.mainPair||[gkeys[0],gkeys[1]];
    const grpA=groups[kA]||[],grpB=groups[kB]||[];

    // Scores per group per technique
    const scoresPerGroup={};
    gkeys.forEach(k=>{scoresPerGroup[k]=techScores(crossCrit,groups[k]);});

    // Welch tests per technique between kA and kB
    const welchByTech={};
    TECHS.forEach(t=>{
      const vA=getNormVals(crossCrit,grpA)[t];
      const vB=getNormVals(crossCrit,grpB)[t];
      if(vA.length>=2&&vB.length>=2)welchByTech[t]=welch(vA,vB);
    });

    // Delta: score_B - score_A per technique
    const deltas={};
    TECHS.forEach(t=>{
      const sA=scoresPerGroup[kA]?.[t],sB=scoresPerGroup[kB]?.[t];
      deltas[t]=(sA!==null&&sB!==null)?sB-sA:null;
    });

    html+=`<div class="group-card">
      <div class="group-title">${g.label}</div>
      <div class="group-sub">${gkeys.map(k=>`${k} (n=${groups[k].length})`).join(' · ')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
        <div>
          <div class="card-title">Scores par technique — ${cLabel}</div>
          <div style="position:relative;height:200px"><canvas id="cross-${g.id}"></canvas></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:.5rem">
            ${gkeys.map((k,i)=>`<span class="leg"><span class="leg-dot" style="background:${['#374151','#9ca3af','#d1d5db'][i]||'#ccc'}"></span>${k}</span>`).join('')}
          </div>
        </div>
        <div>
          <div class="card-title">Test de Welch — ${kA} vs ${kB}</div>
          <div style="margin-bottom:.75rem">
            ${TECHS.map(t=>{
              const w=welchByTech[t];
              const sA=scoresPerGroup[kA]?.[t],sB=scoresPerGroup[kB]?.[t];
              const d=deltas[t];
              if(!w)return'';
              return`<div class="welch-row">
                <div class="welch-tech" style="background:${T_COL[t]}">${t}</div>
                <div style="flex:1">
                  <div style="font-size:11px;color:var(--text3)">${T_LABEL[t]}</div>
                  <div style="font-size:11px;display:flex;gap:8px;margin-top:1px">
                    <span>${kA} : <span class="mono">${sA>=0?'+':''}${sA.toFixed(2)}</span></span>
                    <span>${kB} : <span class="mono">${sB>=0?'+':''}${sB.toFixed(2)}</span></span>
                    ${d!==null?`<span>Δ : <span class="mono ${d>0?'delta-pos':'delta-neg'}">${d>0?'+':''}${d.toFixed(2)}</span></span>`:''}
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
                  ${pvBadge(w.p)}
                  <span style="font-size:10px;color:var(--text3)">t=${w.t.toFixed(2)}, df=${w.df.toFixed(1)}</span>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div style="background:var(--bg);border-radius:4px;padding:.6rem .75rem;font-size:11px;color:var(--text3)">
            Δ = score(${kB}) − score(${kA}) · Test bilatéral H₀ : Δ = 0
          </div>
        </div>
      </div>
    </div>`;
  });

  return html;
}

      ${barGrp("Fréquence d'écoute",fc('freq'))}
      ${barGrp("Système d'écoute",fc('device'))}
    </div>
    <div class="card">
      ${barGrp("Affinité musiques actuelles",fc('pop'))}
      ${barGrp("Profil audiophile",fc('audiophile'))}
      ${barGrp("Professionnel du son",fc('pro'))}
    </div>
  </div>
  <div class="card">
    <div class="card-title">Distribution des âges</div>
    <div class="chart-wrap-sm"><canvas id="age-chart"></canvas></div>
  </div>`;
}

// ── INIT CHARTS ───────────────────────────────────────────────────────────────
function initCharts(){
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{y:{grid:{color:'#e4dfd8'},ticks:{font:{size:10}}},x:{ticks:{font:{size:10}}}}};
  if(tab==='overview'){
    mkChart('radar',{type:'radar',data:{
      labels:CRIT.map(c=>CRIT_L[c]),
      datasets:TECHS.map(t=>({label:`Extrait ${t}`,
        data:CRIT.map(c=>SC[c][t]),
        borderColor:T_COL[t],backgroundColor:T_COL[t]+'18',
        pointBackgroundColor:T_COL[t],borderWidth:1.5,pointRadius:2}))
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{boxWidth:8,font:{size:10}}}},
      scales:{r:{min:-2,max:2,ticks:{stepSize:1,font:{size:9}},pointLabels:{font:{size:11}}}}}});
  }
  if(tab==='tendance'){
    const consist=DATA.map(row=>{
      const sds=PAIRS.map(pair=>intraConsistency(row,pair)).filter(v=>v!==null);
      return sds.length?sds.reduce((a,b)=>a+b,0)/sds.length:null;
    }).filter(v=>v!==null).sort((a,b)=>a-b);
    mkChart('consist-chart',{type:'bar',data:{
      labels:consist.map((_,i)=>`P${i+1}`),
      datasets:[{
        data:consist,
        backgroundColor:consist.map(v=>v<1?'#059669aa':v<2?'#2563ebaa':v<2.5?'#d97706aa':'#dc2626aa'),
        borderColor:consist.map(v=>v<1?'#059669':v<2?'#2563eb':v<2.5?'#d97706':'#dc2626'),
        borderWidth:1,borderRadius:3,
      }]
    },options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`SD moyen : ${ctx.raw.toFixed(2)}`}}},
      scales:{
        y:{min:0,max:4,grid:{color:'#e4dfd8'},ticks:{font:{size:9}},
          title:{display:true,text:'Écart-type intra-participant',font:{size:9}}},
        x:{ticks:{display:false}}
      }
    }});
  }
  if(tab==='pairwise'){
    const sc=SC[pwCrit];
    mkChart('pw-bars',{type:'bar',data:{
      labels:TECHS.map(t=>`Extrait ${t}`),
      datasets:[{
        data:TECHS.map(t=>sc[t]),
        backgroundColor:TECHS.map(t=>T_COL[t]+'55'),
        borderColor:TECHS.map(t=>T_COL[t]),
        borderWidth:1.5,borderRadius:4,
      }]
    },options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.raw>=0?'+':''}${ctx.raw.toFixed(3)}`}}},
      scales:{
        y:{min:-2.5,max:2.5,grid:{color:'#e4dfd8'},ticks:{font:{size:9}},
          title:{display:true,text:'Score moyen normalisé',font:{size:9}}},
        x:{ticks:{font:{size:9}}}
      }
    }});
  }
  if(tab==='criteria'){
    CRIT.forEach(c=>{
      const sc=SC[c];const tt=TT[c];
      mkChart(`bc-${c}`,{type:'bar',data:{
        labels:TECHS.map(t=>`Extrait ${t}`),
        datasets:[{data:TECHS.map(t=>sc[t]),
          backgroundColor:TECHS.map(t=>T_COL[t]+'55'),
          borderColor:TECHS.map(t=>T_COL[t]),borderWidth:1,borderRadius:3}]
      },options:{...base,
        plugins:{...base.plugins,
          annotation:{annotations:TECHS.reduce((a,t,i)=>{
            const test=tt[t];if(test&&test.p<0.1){a[`l${i}`]={type:'label',xValue:i,yValue:sc[t],content:pvSymbol(test.p),font:{size:10}};}return a;},{})}},
        scales:{y:{min:-2.5,max:2.5,grid:{color:'#e4dfd8'},ticks:{font:{size:9}}},x:{ticks:{font:{size:9}}}}}});
    });
  }
  if(tab==='cross'){
    const GROUPS=[
      {id:'pro',split:r=>r.pro==='Oui'?'Professionnel':'Non-professionnel'},
      {id:'aud',split:r=>({Oui:'Audiophile','Un peu':'Intermédiaire',Non:'Non-audiophile'}[r.audiophile]||r.audiophile)},
      {id:'dev',split:r=>r.device.includes('Casque')?'Casque / écouteurs':'Enceintes'},
      {id:'freq',split:r=>r.freq.includes('heures')?'Intensif (plusieurs h/j)':'Occasionnel'},
      {id:'pop',split:r=>r.pop==='Oui'?'Fan de pop/rap':'Autre'},
      {id:'age',split:r=>{const a=parseInt(r.age);return a<25?'18–24 ans':a<29?'25–28 ans':'29+ ans';}},
    ];
    const grpColors=['#374151','#9ca3af','#d1d5db'];
    GROUPS.forEach(g=>{
      const el=document.getElementById(`cross-${g.id}`);if(!el)return;
      const groups={};DATA.forEach(r=>{const k=g.split(r);if(!groups[k])groups[k]=[];groups[k].push(r);});
      const gkeys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
      const datasets=gkeys.map((k,i)=>({
        label:k,
        data:TECHS.map(t=>{const sc=techScores(crossCrit,groups[k]);return sc[t];}),
        backgroundColor:TECHS.map(t=>T_COL[t]+(i===0?'cc':'44')),
        borderColor:TECHS.map(t=>T_COL[t]),
        borderWidth:i===0?1.5:1,
        borderRadius:3,
        borderDash:i===0?[]:[4,2],
      }));
      mkChart(`cross-${g.id}`,{type:'bar',data:{
        labels:TECHS.map(t=>`Extrait ${t}`),
        datasets,
      },options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label} : ${ctx.raw>=0?'+':''}${ctx.raw.toFixed(2)}`}}
        },
        scales:{
          y:{min:-3,max:3,grid:{color:'#e4dfd8'},ticks:{font:{size:9}},
            title:{display:true,text:'Score normalisé',font:{size:9}}},
          x:{ticks:{font:{size:9}}}
        }
      }});
    });
  }
  if(tab==='participants'){
    const ages=DATA.map(r=>parseInt(r.age)).filter(a=>!isNaN(a));
    const bins=[[18,22],[22,26],[26,30],[30,99]];
    mkChart('age-chart',{type:'bar',data:{
      labels:['18–21','22–25','26–29','30+'],
      datasets:[{data:bins.map(([a,b])=>ages.filter(x=>x>=a&&x<b).length),
        backgroundColor:'#18171530',borderColor:'#18171560',borderWidth:1,borderRadius:3}]
    },options:{...base}});
  }
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
document.getElementById('hdr-stats').innerHTML=
  [`<strong>${N}</strong> participants`,`<strong>4</strong> techniques`,`<strong>5</strong> critères`,`<strong>6</strong> paires`]
  .map(s=>`<span>${s}</span>`).join('<span style="color:var(--border2)"> · </span>');
render();
</script>
