name: Enregistrer résultats

on:
  repository_dispatch:
    types: [save_result]

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajouter la ligne au CSV
        env:
          ROW: ${{ toJson(github.event.client_payload.row) }}
          HEADERS: ${{ toJson(github.event.client_payload.headers) }}
        run: |
          ROW_CLEAN=$(echo $ROW | sed 's/^"//;s/"$//')
          HEADERS_CLEAN=$(echo $HEADERS | sed 's/^"//;s/"$//')
          FILE="resultats/resultats.csv"
          mkdir -p resultats
          if [ ! -f "$FILE" ]; then
            printf '\xef\xbb\xbf' > "$FILE"
            echo "$HEADERS_CLEAN" >> "$FILE"
          fi
          echo "$ROW_CLEAN" >> "$FILE"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultats/resultats.csv
          git commit -m "Résultats participant $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
